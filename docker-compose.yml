version: '3.8'

services:
  aquasense:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquasense-agent
    volumes:
      # Persistir modelos y logs entre reinicios
      - aquasense_models:/app/models
      - aquasense_logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped

  # Servicio: solo entrenamiento
  aquasense-train:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquasense-train
    command: ["train"]
    volumes:
      - aquasense_models:/app/models
      - aquasense_logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1

  # Servicio: solo evaluación
  aquasense-eval:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aquasense-eval
    command: ["evaluate"]
    volumes:
      - aquasense_models:/app/models
      - aquasense_logs:/app/logs
    environment:
      - PYTHONUNBUFFERED=1

volumes:
  aquasense_models:
  aquasense_logs:

# Uso:
#   docker compose up --build           # Build + train (default)
#   docker compose up aquasense-train   # Re-entrenar
#   docker compose up aquasense-eval    # Evaluar
#   docker compose run --rm aquasense bash   # Shell interactivo
#   docker compose down -v              # Limpiar todo (incluye volúmenes)